\<!doctype html>
\<html lang="ja">
\<head>
\<meta charset="utf-8">
\<meta name="viewport" content="width=device-width, initial-scale=1">
\<title>練習メニュー\</title>
\<style>
:root{
&#x20; \--ink:#17293a;
&#x20; \--sub:#4d6472;
&#x20; \--blue:#1769aa;
&#x20; \--blue-dark:#0f5488;
&#x20; \--pale:#eef6fb;
&#x20; \--line:#d3e3ec;
&#x20; \--white:#fff;
}

\*{ box-sizing:border-box; }

body{
&#x20; margin:0;
&#x20; min-height:100vh;
&#x20; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
&#x20; color:var(--ink);
&#x20; background:var(--pale);
}

main{
&#x20; width:min(100% - 40px, 960px);
&#x20; margin:0 auto;
&#x20; padding:56px 0 64px;
}

.header{
&#x20; text-align:center;
&#x20; margin-bottom:44px;
}

.header h1{
&#x20; margin:0 0 14px;
&#x20; font-size:40px;
&#x20; line-height:1.35;
&#x20; letter-spacing:.02em;
}

.header p{
&#x20; margin:0;
&#x20; font-size:18px;
&#x20; line-height:1.8;
&#x20; color:var(--sub);
}

.menu{
&#x20; display:grid;
&#x20; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
&#x20; align-items:stretch;
&#x20; gap:20px;
}

.menu-link{
&#x20; display:flex;
&#x20; flex-direction:column;
&#x20; height:100%;
&#x20; padding:30px 32px;
&#x20; color:var(--ink);
&#x20; text-decoration:none;
&#x20; background:var(--white);
&#x20; border:2px solid var(--line);
&#x20; border-radius:18px;
&#x20; box-shadow:0 3px 10px rgba(23,41,58,.06);
&#x20; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}

.menu-link:hover,
.menu-link:focus-visible{
&#x20; transform:translateY(-2px);
&#x20; border-color:var(--blue);
&#x20; box-shadow:0 10px 22px rgba(23,41,58,.12);
&#x20; outline:none;
}

.head{
&#x20; display:flex;
&#x20; align-items:center;
&#x20; gap:20px;
&#x20; margin-bottom:16px;
}

.badge{
&#x20; flex:none;
&#x20; width:64px;
&#x20; height:64px;
&#x20; display:flex;
&#x20; align-items:center;
&#x20; justify-content:center;
&#x20; border-radius:50%;
&#x20; background:var(--blue);
&#x20; color:#fff;
&#x20; font-size:24px;
&#x20; font-weight:700;
&#x20; line-height:1;
}

.title{
&#x20; font-size:24px;
&#x20; font-weight:700;
&#x20; line-height:1.4;
}

.description{
&#x20; flex:1;
&#x20; margin:0 0 22px;
&#x20; font-size:16px;
&#x20; line-height:1.75;
&#x20; color:var(--sub);
}

.cta{
&#x20; margin-top:auto;
&#x20; padding:14px 0;
&#x20; border-radius:999px;
&#x20; background:var(--blue);
&#x20; color:#fff;
&#x20; font-size:16px;
&#x20; font-weight:700;
&#x20; text-align:center;
}

.menu-link:hover .cta,
.menu-link:focus-visible .cta{
&#x20; background:var(--blue-dark);
}

.footer{
&#x20; text-align:center;
&#x20; margin-top:44px;
&#x20; font-size:15px;
&#x20; color:var(--sub);
}

@media (max-width:640px){
&#x20; main{
&#x20;   padding:36px 0 48px;
&#x20; }

&#x20; .header h1{
&#x20;   font-size:30px;
&#x20; }

&#x20; .header p{
&#x20;   font-size:16px;
&#x20; }

&#x20; .menu{
&#x20;   grid-template-columns:1fr;
&#x20; }

&#x20; .menu-link{
&#x20;   padding:24px 22px;
&#x20; }

&#x20; .title{
&#x20;   font-size:20px;
&#x20; }

&#x20; .badge{
&#x20;   width:56px;
&#x20;   height:56px;
&#x20;   font-size:21px;
&#x20; }
}
\</style>
\</head>
